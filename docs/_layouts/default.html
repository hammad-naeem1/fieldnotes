<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="hammad.dev home">hammad<span>.dev</span></a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/learning-path/' | relative_url }}" {% if page.url contains 'learning-path' %}aria-current="page"{% endif %}>Learn ML</a>
          <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}aria-current="page"{% endif %}>Blog</a>
          <a href="{{ '/portfolio/' | relative_url }}" {% if page.url contains '/portfolio' %}aria-current="page"{% endif %}>Portfolio</a>
          <a class="nav-contact" href="mailto:hammadconnect1@gmail.com">Say hello <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    <main id="main">{{ content }}</main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div>
          <a class="wordmark footer-wordmark" href="{{ '/' | relative_url }}">hammad<span>.dev</span></a>
          <p class="footer-note">Notes from the process of learning and building with machine learning.</p>
        </div>
        <div class="footer-links" aria-label="Social links">
          <a href="https://github.com/hammad-naeem1" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
          <a href="https://huggingface.co/CodeWithHammad" target="_blank" rel="noopener noreferrer">Hugging Face <span aria-hidden="true">↗</span></a>
          <span>Discord: hammad-naeem1</span>
          <a href="mailto:hammadconnect1@gmail.com">Email <span aria-hidden="true">↗</span></a>
        </div>
      </div>
      <div class="footer-bottom"><span>© {{ 'now' | date: '%Y' }} Hammad Naeem</span><span>Built from Markdown in GitHub.</span></div>
    </footer>
  </body>
</html>
